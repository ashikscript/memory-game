<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 মেমোরি কার্ড গেম</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --card-back: #0f3460;
    --card-front: #e94560;
    --gold: #f5a623;
    --text: #eaeaea;
    --muted: #888;
    --p1: #4fc3f7;
    --p2: #ef9a9a;
    --bot: #a5d6a7;
    --radius: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  h1 {
    font-size: 28px;
    text-align: center;
    margin-bottom: 6px;
    background: linear-gradient(135deg, var(--gold), #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 20px; }

  /* SCREENS */
  .screen { width: 100%; max-width: 480px; display: none; }
  .screen.active { display: block; }

  /* MENU */
  .menu-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .menu-card h2 { font-size: 16px; color: var(--gold); margin-bottom: 16px; text-align: center; }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn:hover { transform: translateY(-2px); opacity: 0.9; }
  .btn:active { transform: scale(0.97); }

  .btn-p1 { background: var(--p1); color: #0d1b2a; }
  .btn-2p { background: var(--p2); color: #1a0a0a; }
  .btn-bot { background: var(--bot); color: #0a1a0a; }
  .btn-gold { background: var(--gold); color: #1a0a00; }
  .btn-gray { background: #444; color: var(--text); }

  .difficulty { display: flex; gap: 8px; margin-bottom: 16px; }
  .diff-btn {
    flex: 1; padding: 10px; border: 2px solid #444; background: transparent;
    color: var(--text); border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
    transition: all 0.15s;
  }
  .diff-btn.selected { border-color: var(--gold); background: rgba(245,166,35,0.15); color: var(--gold); }

  label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
  input[type="text"] {
    width: 100%; padding: 10px 14px; background: #0f3460; border: 1.5px solid #333;
    border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 14px;
  }

  /* GAME SCREEN */
  .game-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; background: var(--surface);
    border-radius: var(--radius); padding: 12px 16px;
    box-shadow: var(--shadow);
  }

  .player-info {
    text-align: center; padding: 6px 10px; border-radius: 8px;
    transition: all 0.3s; flex: 1;
  }
  .player-info.active-turn { background: rgba(245,166,35,0.2); }
  .player-name { font-size: 13px; font-weight: 600; }
  .player-score { font-size: 22px; font-weight: 700; }
  .player-info.p1 .player-name { color: var(--p1); }
  .player-info.p2 .player-name { color: var(--p2); }
  .player-info.bot-info .player-name { color: var(--bot); }

  .turn-badge {
    font-size: 11px; background: var(--gold); color: #1a0a00;
    padding: 2px 8px; border-radius: 20px; font-weight: 700; margin-top: 2px;
    display: none;
  }
  .player-info.active-turn .turn-badge { display: inline-block; }

  .grid-wrap { width: 100%; max-width: 460px; margin: 0 auto; }
  .grid {
    display: grid;
    gap: 8px;
    width: 100%;
  }

  .card {
    aspect-ratio: 1;
    cursor: pointer;
    perspective: 600px;
    border-radius: 10px;
  }

  .card-inner {
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
    border-radius: 10px;
    position: relative;
  }

  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }
  .card.matched .card-front { background: #1a4a1a !important; border-color: #4caf50; }

  .card.fly-away {
    animation: flyUp 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    pointer-events: none;
    position: relative; z-index: 10;
  }
  @keyframes flyUp {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    35%  { transform: translateY(-28px) scale(1.2); opacity: 1; }
    100% { transform: translateY(-130px) scale(0.2); opacity: 0; }
  }
  .card.gone { visibility: hidden; pointer-events: none; }

  .card-back, .card-front {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(20px, 8vw, 36px);
    border: 2px solid #333;
  }

  .card-back { background: var(--card-back); }
  .card-back::after {
    content: '?';
    font-size: clamp(18px, 6vw, 28px);
    color: rgba(255,255,255,0.3);
    font-weight: 700;
  }
  .card-front { background: #1a2a4a; transform: rotateY(180deg); border-color: #4fc3f7; }

  .card:not(.flipped):not(.matched):hover .card-back {
    background: #1a4a7a;
    border-color: var(--gold);
  }

  /* STATUS BAR */
  .status-bar {
    text-align: center; padding: 8px; background: var(--surface);
    border-radius: 8px; margin-top: 10px; font-size: 13px; color: var(--muted);
    min-height: 32px;
  }
  .status-bar span { color: var(--gold); font-weight: 600; }

  /* RESULT SCREEN */
  .result-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 30px 24px; text-align: center; box-shadow: var(--shadow);
  }
  .result-title { font-size: 32px; margin-bottom: 8px; }
  .result-winner { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  .result-scores { display: flex; gap: 16px; justify-content: center; margin-bottom: 24px; }
  .score-box { background: #0f3460; border-radius: 10px; padding: 14px 20px; min-width: 90px; }
  .score-box .name { font-size: 13px; margin-bottom: 4px; }
  .score-box .pts { font-size: 28px; font-weight: 700; }

  /* BOT THINKING */
  .bot-thinking {
    display: none; text-align: center; padding: 10px;
    color: var(--bot); font-size: 14px; font-weight: 600;
  }
  .dot { animation: blink 1s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

  /* CONFETTI */
  .confetti-piece {
    position: fixed; width: 10px; height: 10px; border-radius: 2px;
    animation: confetti-fall 2s ease-in forwards;
    pointer-events: none; z-index: 999;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<h1>🃏 মেমোরি কার্ড গেম</h1>
<p class="subtitle">কার্ড উল্টে একই জোড়া খুঁজে পাও!</p>

<!-- MENU SCREEN -->
<div class="screen active" id="menuScreen">
  <div class="menu-card">
    <h2>🎮 গেম মোড বেছে নাও</h2>
    <button class="btn btn-p1" onclick="startGame('single')">👤 একক খেলা (১ জন)</button>
    <button class="btn btn-2p" onclick="startGame('two')">👥 দুইজন খেলা</button>
    <button class="btn btn-bot" onclick="startGame('bot')">🤖 বটের সাথে খেলো</button>
  </div>

  <div class="menu-card">
    <h2>⚙️ সেটিংস</h2>

    <label>কঠিনতা (বট মোডের জন্য):</label>
    <div class="difficulty">
      <button class="diff-btn selected" id="diff-easy" onclick="setDiff('easy')">সহজ 😊</button>
      <button class="diff-btn" id="diff-medium" onclick="setDiff('medium')">মাঝারি 😐</button>
      <button class="diff-btn" id="diff-hard" onclick="setDiff('hard')">কঠিন 😈</button>
    </div>

    <label>গ্রিড সাইজ:</label>
    <div class="difficulty">
      <button class="diff-btn selected" id="grid-4x5" onclick="setGrid(5)">৪×৫</button>
      <button class="diff-btn" id="grid-4x6" onclick="setGrid(6)">৪×৬</button>
      <button class="diff-btn" id="grid-5x7" onclick="setGrid57()">৫×৭*</button>
    </div>
    <p style="font-size:11px; color:var(--muted); margin-top:-10px; margin-bottom:10px;">* ৫×৭ = ৩৫ কার্ড (১ বোনাস কার্ড থাকবে)</p>

    <label>খেলোয়াড় ১ এর নাম:</label>
    <input type="text" id="p1Name" value="খেলোয়াড় ১" />

    <label>খেলোয়াড় ২ এর নাম (দুইজন মোডে):</label>
    <input type="text" id="p2Name" value="খেলোয়াড় ২" />
  </div>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="gameScreen">
  <div class="game-header">
    <div class="player-info p1 active-turn" id="p1Info">
      <div class="player-name" id="p1Label">খেলোয়াড় ১</div>
      <div class="player-score" id="p1Score">০</div>
      <div class="turn-badge">তোমার পালা ▶</div>
    </div>

    <div style="text-align:center; padding: 0 8px;">
      <div style="font-size:11px; color:var(--muted)">জোড়া</div>
      <div style="font-size:18px; font-weight:700; color:var(--gold)" id="pairsLeft">০</div>
      <div style="font-size:10px; color:var(--muted)">বাকি</div>
    </div>

    <div class="player-info p2" id="p2Info">
      <div class="player-name" id="p2Label">খেলোয়াড় ২</div>
      <div class="player-score" id="p2Score">০</div>
      <div class="turn-badge">তোমার পালা ▶</div>
    </div>
  </div>

  <div class="bot-thinking" id="botThinking">
    🤖 বট ভাবছে<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="status-bar" id="statusBar">খেলা শুরু হয়েছে!</div>

  <button class="btn btn-gray" style="margin-top:12px; width:100%;" onclick="showMenu()">🏠 মেনুতে ফিরে যাও</button>
</div>

<!-- RESULT SCREEN -->
<div class="screen" id="resultScreen">
  <div class="result-card">
    <div class="result-title" id="resultEmoji">🎉</div>
    <div class="result-winner" id="resultWinner">বিজয়ী!</div>
    <div class="result-scores" id="resultScores"></div>
    <button class="btn btn-gold" onclick="replayGame()">🔄 আবার খেলো</button>
    <button class="btn btn-gray" style="margin-top:0" onclick="showMenu()">🏠 মেনু</button>
  </div>
</div>

<script>
// Mixed card types: football/sports, sweets/chocolate, fruits, nature, misc fun
const EMOJIS = [
  // ⚽ Football & Sports
  '⚽','🏀','🎾','🏈','🎱','🏓','🥊','🏆',
  // 🍫 Sweets & Chocolate
  '🍫','🍬','🍭','🍩','🍪','🧁','🍰','🎂',
  // 🍓 Fruits
  '🍓','🍋','🍇','🍑','🥭','🍍','🫐','🍌',
  // 🌟 Fun misc
  '🎯','🎲','🎪','🎠','🚀','💎','🔥','🌊'
];

let gameMode = 'single';
let difficulty = 'easy';
let gridCols = 4;
let gridRows = 5;
let currentPlayer = 1;
let scores = { 1: 0, 2: 0 };
let flipped = [];
let matched = [];
let locked = false;
let cards = [];
let botMemory = {};
let lastMode = 'single';

function setDiff(d) {
  difficulty = d;
  document.querySelectorAll('[id^=diff-]').forEach(b => b.classList.remove('selected'));
  document.getElementById('diff-' + d).classList.add('selected');
}

function setGrid(r) {
  gridCols = 4;
  gridRows = r;
  ['4x5','4x6','5x7'].forEach(x => {
    const el = document.getElementById('grid-'+x);
    if (el) el.classList.remove('selected');
  });
  document.getElementById('grid-4x' + r).classList.add('selected');
}

function setGrid57() {
  gridCols = 5;
  gridRows = 7;
  ['4x5','4x6','5x7'].forEach(x => {
    const el = document.getElementById('grid-'+x);
    if (el) el.classList.remove('selected');
  });
  document.getElementById('grid-5x7').classList.add('selected');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showMenu() {
  const currentScreen = document.querySelector('.screen.active');
  if (currentScreen && currentScreen.id === 'gameScreen') {
    const confirmed = confirm('⚠️ সত্যিই মেনুতে ফিরে যেতে চাও?\nখেলার সব অগ্রগতি মুছে যাবে!');
    if (!confirmed) return;
  }
  showScreen('menuScreen');
}

function startGame(mode) {
  gameMode = mode;
  lastMode = mode;
  currentPlayer = 1;
  scores = { 1: 0, 2: 0 };
  flipped = [];
  matched = [];
  locked = false;
  botMemory = {};

  const total = gridCols * gridRows;
  const pairs = Math.floor(total / 2);
  const pool = EMOJIS.slice(0, pairs);
  const deck = [...pool, ...pool];
  // If odd total (5x7=35), add one bonus card
  if (total % 2 !== 0) deck.push('⭐');
  deck.sort(() => Math.random() - 0.5);
  cards = deck;

  const p1 = document.getElementById('p1Name').value || 'খেলোয়াড় ১';
  const p2 = document.getElementById('p2Name').value || 'খেলোয়াড় ২';

  document.getElementById('p1Label').textContent = p1;
  document.getElementById('p2Label').textContent = mode === 'bot' ? '🤖 বট' : p2;
  document.getElementById('p1Score').textContent = '০';
  document.getElementById('p2Score').textContent = '০';
  document.getElementById('pairsLeft').textContent = pairs;

  // Style p2
  const p2Info = document.getElementById('p2Info');
  p2Info.className = mode === 'bot' ? 'player-info bot-info' : 'player-info p2';

  updateTurnUI();
  renderGrid();
  showScreen('gameScreen');
  setStatus('খেলা শুরু হয়েছে! কার্ড উল্টাও 🎮');
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const total = gridCols * gridRows;
  grid.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  grid.innerHTML = '';

  for (let i = 0; i < total; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.innerHTML = `<div class="card-inner"><div class="card-back"></div><div class="card-front">${cards[i]}</div></div>`;
    card.addEventListener('click', () => onCardClick(i));
    grid.appendChild(card);
  }
}

function onCardClick(idx) {
  if (locked) return;
  if (gameMode === 'bot' && currentPlayer === 2) return;
  if (matched.includes(idx) || flipped.includes(idx)) return;

  flipCard(idx);
  flipped.push(idx);

  if (flipped.length === 2) {
    locked = true;
    const [a, b] = flipped;
    botMemory[a] = cards[a];
    botMemory[b] = cards[b];

    if (cards[a] === cards[b]) {
      handleMatch(a, b);
    } else {
      setTimeout(() => {
        unflipCard(a);
        unflipCard(b);
        flipped = [];
        locked = false;
        switchPlayer();
        if (gameMode === 'bot' && currentPlayer === 2) {
          setTimeout(botTurn, 600);
        }
      }, 900);
    }
  } else {
    botMemory[idx] = cards[idx];
  }
}

function handleMatch(a, b) {
  matched.push(a, b);
  scores[currentPlayer]++;
  updateScoreUI();

  const pairs = (gridCols * gridRows) / 2;
  document.getElementById('pairsLeft').textContent = pairs - matched.length / 2;

  const name = currentPlayer === 1
    ? document.getElementById('p1Label').textContent
    : document.getElementById('p2Label').textContent;
  setStatus(`✅ <span>${name}</span> একটি জোড়া পেয়েছে! +১ পয়েন্ট 🎉`);

  // Flip face-up first, then fly away
  const elA = getCardEl(a);
  const elB = getCardEl(b);
  elA.classList.add('matched');
  elB.classList.add('matched');

  setTimeout(() => {
    elA.classList.add('fly-away');
    elB.classList.add('fly-away');
    setTimeout(() => {
      elA.classList.add('gone');
      elB.classList.add('gone');
      flipped = [];
      locked = false;

      if (matched.length === gridCols * gridRows) {
        setTimeout(showResult, 300);
        return;
      }
      if (gameMode === 'bot' && currentPlayer === 2) {
        setTimeout(botTurn, 500);
      }
    }, 560);
  }, 300);
}

function switchPlayer() {
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  updateTurnUI();
  const name = currentPlayer === 1
    ? document.getElementById('p1Label').textContent
    : document.getElementById('p2Label').textContent;
  setStatus(`🎯 <span>${name}</span> এর পালা`);
}

function updateTurnUI() {
  const p1Info = document.getElementById('p1Info');
  const p2Info = document.getElementById('p2Info');
  p1Info.classList.toggle('active-turn', currentPlayer === 1);
  p2Info.classList.toggle('active-turn', currentPlayer === 2);
}

function updateScoreUI() {
  document.getElementById('p1Score').textContent = toBengaliNum(scores[1]);
  document.getElementById('p2Score').textContent = toBengaliNum(scores[2]);
}

function toBengaliNum(n) {
  return n.toString().replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
}

function flipCard(idx) { getCardEl(idx).classList.add('flipped'); }
function unflipCard(idx) { getCardEl(idx).classList.remove('flipped'); }
function getCardEl(idx) { return document.querySelector(`.card[data-index="${idx}"]`); }

function setStatus(html) {
  document.getElementById('statusBar').innerHTML = html;
}

// BOT LOGIC
function botTurn() {
  if (matched.length === gridCols * gridRows) return;

  const total = gridCols * gridRows;
  const available = Array.from({length: total}, (_,i)=>i).filter(i => !matched.includes(i));

  document.getElementById('botThinking').style.display = 'block';

  // Bot memory: look for known pairs
  let pick1 = -1, pick2 = -1;

  if (difficulty !== 'easy') {
    // Check memory for known matching pair
    const known = Object.entries(botMemory).filter(([i]) => !matched.includes(+i));
    const grouped = {};
    known.forEach(([i, v]) => {
      if (!grouped[v]) grouped[v] = [];
      grouped[v].push(+i);
    });
    for (const [v, idxs] of Object.entries(grouped)) {
      if (idxs.length >= 2) {
        pick1 = idxs[0]; pick2 = idxs[1]; break;
      }
    }
  }

  const memoryChance = difficulty === 'medium' ? 0.5 : difficulty === 'hard' ? 0.9 : 0;

  if ((pick1 === -1 || Math.random() > memoryChance) && difficulty !== 'hard') {
    // Random picks
    const shuffled = available.sort(() => Math.random() - 0.5);
    pick1 = shuffled[0];
    pick2 = shuffled[1];
  } else if (pick1 === -1) {
    const shuffled = available.sort(() => Math.random() - 0.5);
    pick1 = shuffled[0];
    pick2 = shuffled[1];
  }

  setTimeout(() => {
    document.getElementById('botThinking').style.display = 'none';
    flipCard(pick1);
    flipped.push(pick1);
    botMemory[pick1] = cards[pick1];

    setTimeout(() => {
      // For hard/medium: after seeing pick1, check memory for match
      if (difficulty !== 'easy' && pick2 !== -1) {
        const known = Object.entries(botMemory).filter(([i]) => !matched.includes(+i) && +i !== pick1);
        const match = known.find(([i, v]) => v === cards[pick1]);
        if (match) pick2 = +match[0];
      }

      flipCard(pick2);
      flipped.push(pick2);
      botMemory[pick2] = cards[pick2];

      setTimeout(() => {
        const [a, b] = flipped;
        if (cards[a] === cards[b]) {
          handleMatch(a, b);
        } else {
          setTimeout(() => {
            unflipCard(a);
            unflipCard(b);
            flipped = [];
            locked = false;
            switchPlayer();
          }, 800);
        }
      }, 700);
    }, 600);
  }, 800);
}

function showResult() {
  const p1Name = document.getElementById('p1Label').textContent;
  const p2Name = document.getElementById('p2Label').textContent;

  let emoji, winner;
  if (gameMode === 'single') {
    emoji = '🎊';
    winner = `${p1Name} জিতেছে ${toBengaliNum(scores[1])} পয়েন্ট নিয়ে!`;
  } else if (scores[1] > scores[2]) {
    emoji = '🏆'; winner = `🎉 ${p1Name} জিতেছে!`;
  } else if (scores[2] > scores[1]) {
    emoji = '🏆'; winner = `🎉 ${p2Name} জিতেছে!`;
  } else {
    emoji = '🤝'; winner = 'ড্র! সমান পয়েন্ট!';
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultWinner').textContent = winner;

  document.getElementById('resultScores').innerHTML = `
    <div class="score-box">
      <div class="name" style="color:var(--p1)">${p1Name}</div>
      <div class="pts" style="color:var(--p1)">${toBengaliNum(scores[1])}</div>
    </div>
    ${gameMode !== 'single' ? `<div class="score-box">
      <div class="name" style="color:${gameMode==='bot'?'var(--bot)':'var(--p2)'}">${p2Name}</div>
      <div class="pts" style="color:${gameMode==='bot'?'var(--bot)':'var(--p2)'}">${toBengaliNum(scores[2])}</div>
    </div>` : ''}
  `;

  showScreen('resultScreen');
  if (scores[1] !== scores[2] || gameMode === 'single') launchConfetti();
}

function replayGame() { startGame(lastMode); }

function launchConfetti() {
  const colors = ['#f5a623','#ff6b6b','#4fc3f7','#a5d6a7','#ef9a9a','#fff'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.5 + Math.random()) + 's';
      el.style.width = el.style.height = (8 + Math.random() * 8) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }, i * 40);
  }
}
</script>
